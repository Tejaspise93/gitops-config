# ============================================================
# gitops-config/environments/dev/values.yaml
# Dev environment overrides for the gitops-app Helm chart.
#
# Jenkins pipeline updates image.tag automatically on every build.
# All other values inherit from charts/gitops-app/values.yaml.
# ============================================================

image:
  repository: tejaspise/gitops-app
  tag: "b20d92960e6710307c90ec8a59b22717454cc5d7" # jenkins replaces this field 
  pullPolicy: IfNotPresent
replicaCount: 1
namespace: dev
# Enable Prometheus scraping in dev so metrics are available.
podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/path: "/actuator/prometheus"
  prometheus.io/port: "8080"
resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

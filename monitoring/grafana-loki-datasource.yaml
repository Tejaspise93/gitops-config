# monitoring/grafana-loki-datasource.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki:3100
        isDefault: false
        jsonData:
          derivedFields:
            - datasourceUid: prometheus
              matcherRegex: "traceId=(\\w+)"
              name: TraceID
              url: "$${__value.raw}"